<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harborlux — Claim Your Summit</title>
<meta name="description" content="Harborlux: harbour-view penthouses above a city that never sleeps. Claim your summit.">
<meta name="theme-color" content="#0D0A22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D0A22'/%3E%3Cpath d='M7 23l9-14 9 14' fill='none' stroke='%23F2B8C0' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://images.higgs.ai" crossorigin>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin>
<link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{
  font-family:"Inter";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
:root{
  --bg:#0D0A22;
  --ink:#180F3C;
  --btn:#F2B8C0;
  --btn-hover:#F7C9D0;
  --text:#FFFFFF;
  --link:rgba(255,255,255,.88);
  --glass:rgba(255,255,255,.14);
  --glass-ring:rgba(255,255,255,.12);
  --u:calc(min(100vw, 160vh) / 1440);
}
@supports (height:1svh){ :root{ --u:calc(min(100vw, 160svh) / 1440); } }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}

/* ---------- hero + stage ---------- */
.hero{
  position:relative;
  isolation:isolate;
  width:100%;
  height:100vh;height:100svh;
  min-height:520px;
  overflow:hidden;
  background:var(--bg);
}
.stage{
  position:absolute;
  left:50%;top:50%;
  width:max(100vw, 177.7778vh);
  aspect-ratio:16/9;
  transform:translate(-50%,-50%);
  z-index:1;
}
.stage.is-sized{transform:none}
.layer{position:absolute;inset:0}
.layer > img,.layer > video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  user-select:none;-webkit-user-drag:none;
}
.back{transform-origin:50% 40%;z-index:1}
.headline{z-index:2}
.mid{transform-origin:50% 45%;z-index:3}
.front{transform-origin:50% 100%;z-index:4}

.rain{opacity:0;transition:opacity .7s linear}
.rain.on{opacity:1}
.shade{
  position:absolute;left:0;right:0;top:0;height:45%;
  background:linear-gradient(to bottom, rgba(13,8,40,.45), rgba(13,8,40,0));
  pointer-events:none;
}

.glass{
  position:absolute;
  left:5.2%;right:4.1%;top:57.9%;height:25.4%;
  background:linear-gradient(to bottom, rgba(190,200,255,.10) 0%, rgba(150,160,230,.05) 60%, rgba(120,130,210,.08) 100%);
  -webkit-backdrop-filter:blur(1.2px) saturate(1.05);
  backdrop-filter:blur(1.2px) saturate(1.05);
  border-top:1px solid rgba(255,255,255,.18);
}

/* ---------- headline ---------- */
.headline{
  position:absolute;top:0;left:0;width:100vw;height:100%;
  pointer-events:none;
}
.word{
  position:absolute;left:0;right:0;top:0;
  margin:0;
  font-size:290px;
  font-weight:700;
  letter-spacing:-.045em;
  line-height:1;
  text-align:center;
  white-space:nowrap;
  color:var(--text);
}
.word .w{display:inline-block}
.word .l{display:inline-block;will-change:transform,opacity}
.word .bl{display:inline-block;width:0;height:0}
.kicker{
  position:absolute;
  left:-.1em;right:.1em;top:0;
  margin:0;
  font-size:34px;
  font-weight:300;
  letter-spacing:-.01em;
  line-height:1;
  text-align:center;
  white-space:nowrap;
  color:var(--text);
}

/* ---------- nav ---------- */
.nav{
  position:absolute;
  z-index:8;
  left:0;right:0;
  top:calc(52 * var(--u));
  height:calc(48 * var(--u));
  padding:0 calc(125 * var(--u));
  display:flex;align-items:center;justify-content:space-between;
  font-size:calc(15 * var(--u));
  line-height:1;
}
.brand{
  font-weight:600;
  font-size:calc(17 * var(--u));
  letter-spacing:.28em;
  color:var(--text);
  white-space:nowrap;
}
.pills{
  position:absolute;
  left:50%;top:0;
  height:100%;
  transform:translateX(-50%);
  display:flex;align-items:center;
  gap:calc(6 * var(--u));
  padding:calc(5 * var(--u));
  border-radius:999px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  box-shadow:inset 0 0 0 1px var(--glass-ring);
}
.pills a{
  height:calc(38 * var(--u));
  padding:0 calc(22 * var(--u));
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;
  font-weight:400;
  color:var(--link);
  white-space:nowrap;
  transition:background-color .25s ease, color .25s ease;
}
.pills a:hover{background:rgba(255,255,255,.14)}
.pills a[aria-current="page"]{background:#fff;color:var(--ink);font-weight:600}
.nav__right{display:flex;align-items:center;gap:calc(30 * var(--u))}
.lang{
  display:inline-flex;align-items:center;gap:calc(9 * var(--u));
  color:rgba(255,255,255,.9);
  white-space:nowrap;
}
.lang svg{width:calc(20 * var(--u));height:calc(20 * var(--u));flex:none}
.btn{
  height:calc(44 * var(--u));
  padding:0 calc(27 * var(--u));
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;
  background:var(--btn);
  color:var(--ink);
  font-weight:600;
  white-space:nowrap;
  transition:transform .25s ease, background-color .25s ease;
}
.btn:hover{transform:translateY(-1px);background:var(--btn-hover)}
.nav a:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- opening + doors ---------- */
.opening{position:absolute;inset:0;z-index:6;background:var(--bg)}
.opening > img,.opening > video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.opening > video{opacity:0}
.doors{position:absolute;inset:0;z-index:7;overflow:hidden}
.door{
  position:absolute;top:0;
  width:50%;height:100%;
  background-color:#07060f;
  background-repeat:no-repeat;
  background-size:200% 100%;
  will-change:transform;
}
.door--l{left:0;background-position:0 50%}
.door--r{right:0;background-position:100% 50%}
.opening[hidden],.doors[hidden]{display:none}

/* ---------- intro start states ---------- */
.hero.intro .nav{opacity:0;transform:translateY(-6px)}
.hero.intro .word .l,.hero.intro .kicker{opacity:0}
.hero.intro .front{transform:translateY(66%)}
.hero.intro .shade{opacity:0}

/* ---------- small screens ---------- */
@media (max-width:819.98px){
  :root{--u:1px}
  .nav{
    top:16px;height:auto;
    padding:0 18px;
    flex-wrap:wrap;
    row-gap:12px;
  }
  .brand{font-size:14px;letter-spacing:.22em}
  .lang{font-size:13px}
  .lang svg{width:16px;height:16px}
  .btn{height:36px;padding:0 16px;font-size:13px}
  .pills{
    position:static;transform:none;
    order:3;
    width:100%;
    height:40px;
    padding:4px;
    gap:4px;
  }
  .pills a{flex:1 1 auto;height:32px;font-size:12px;padding:0 10px}
}
@media (max-width:360px){
  .pills a{font-size:11px;padding:0 6px}
}
@media (max-height:500px) and (orientation:landscape){
  :root{--u:1px}
  .nav{
    top:12px;height:34px;
    padding:0 24px;
    flex-wrap:nowrap;
    font-size:12px;
  }
  .brand{font-size:13px;letter-spacing:.24em}
  .lang{font-size:12px}
  .lang svg{width:16px;height:16px}
  .btn{height:32px;padding:0 16px;font-size:12px}
  .nav__right{gap:18px}
  .pills{
    position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:auto;height:34px;padding:3px;gap:4px;
  }
  .pills a{flex:none;height:28px;font-size:12px;padding:0 13px}
}

@media (prefers-reduced-motion:reduce){
  .rain{transition:none}
}
</style>
</head>
<body>
<section class="hero intro" id="hero" aria-label="Harborlux — Claim Your Summit">

  <div class="stage" id="stage">
    <div class="layer back" id="back">
      <img id="imgBack" alt="" decoding="async">
      <video class="rain" id="rainA" muted playsinline preload="auto" aria-hidden="true"></video>
      <video class="rain" id="rainB" muted playsinline preload="auto" aria-hidden="true"></video>
      <div class="shade" id="shade"></div>
    </div>

    <div class="headline" id="headline">
      <p class="kicker" id="kicker" aria-hidden="true">Claim Your</p>
      <h1 class="word" id="word" aria-label="Claim Your Summit"><span class="w" id="wordInner" aria-hidden="true"><span class="l">S</span><span class="l">u</span><span class="l">m</span><span class="l">m</span><span class="l">i</span><span class="l">t</span><i class="bl" id="baseline"></i></span></h1>
    </div>

    <div class="layer mid" id="mid">
      <img id="imgMid" alt="" decoding="async">
    </div>

    <div class="layer front" id="front">
      <div class="glass" aria-hidden="true"></div>
      <img id="imgFront" alt="A man in a long dark coat stands at a glass balcony railing, looking out over a rainy neon harbour at night" decoding="async">
    </div>
  </div>

  <header class="nav" id="nav">
    <a class="brand" href="/">HARBORLUX</a>
    <nav class="pills" aria-label="Main">
      <a href="/" aria-current="page">Home</a>
      <a href="#the-firm">The Firm</a>
      <a href="#skyline-homes">Skyline Homes</a>
      <a href="#talk-to-us">Talk To Us</a>
    </nav>
    <div class="nav__right">
      <span class="lang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c-3.2 3-3.2 15 0 18M12 3c3.2 3 3.2 15 0 18"/></svg>
        Eng
      </span>
      <a class="btn" href="#talk-to-us">Enquire</a>
    </div>
  </header>

  <div class="opening" id="opening" aria-hidden="true">
    <img id="imgAerial" alt="" decoding="async">
    <video id="tilt" muted playsinline preload="auto"></video>
  </div>

  <div class="doors" id="doors" aria-hidden="true">
    <div class="door door--l" id="doorL"></div>
    <div class="door door--r" id="doorR"></div>
  </div>
</section>

<script>
(function () {
  "use strict";

  /* ---------- media ---------- */
  var CDN = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_";
  var IDS = {
    doors:  "063048_97fd9a70-adbe-46bd-bfce-ec1004f6c7d8",
    aerial: "063055_ee1debcd-d200-484f-b94f-fad6dcffd4eb",
    back:   "063251_24fbd7cc-00df-49ec-8fbf-d8a0349b1e98",
    mid:    "063252_b9f2fecf-9be0-485f-842f-3aa6bbc251f2",
    front:  "063151_7804d758-a2eb-4499-9b56-8f493edbb206"
  };
  var TILT_SRC = CDN + "063355_a600befc-45d6-4a32-9db6-9d6565a89609.mp4";
  var RAIN_SRC = CDN + "063703_04e54df7-2236-4dff-b95b-a9a34c1f78ec.mp4";
  function img(id, w) {
    return "https://images.higgs.ai/?default=1&output=webp&url=" +
      encodeURIComponent(CDN + id + ".png") + "&w=" + w + "&q=85";
  }
  function pickW(cssPx) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.ceil((cssPx * dpr) / 100) * 100;
    return Math.max(600, Math.min(2700, w));
  }

  /* ---------- elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var hero = $("hero"), stage = $("stage"), back = $("back"), mid = $("mid"), front = $("front");
  var headline = $("headline"), word = $("word"), wordInner = $("wordInner"), baseline = $("baseline");
  var kicker = $("kicker"), nav = $("nav"), shade = $("shade");
  var opening = $("opening"), doors = $("doors"), doorL = $("doorL"), doorR = $("doorR");
  var tilt = $("tilt"), rainA = $("rainA"), rainB = $("rainB");
  var letters = Array.prototype.slice.call(word.querySelectorAll(".l"));

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- layout ---------- */
  var wpe = 3.4;      // word width per em (measured)
  var blr = 0.8633;   // baseline offset from top of h1, in em (measured)

  function measure() {
    var prev = word.style.fontSize;
    word.style.fontSize = "100px";
    var wr = wordInner.getBoundingClientRect();
    var hr = word.getBoundingClientRect();
    var br = baseline.getBoundingClientRect();
    if (wr.width > 0) {
      wpe = wr.width / 100;
      blr = (br.bottom - hr.top) / 100;
    }
    word.style.fontSize = prev;
  }

  function layout() {
    var vw = hero.clientWidth, vh = hero.clientHeight;
    var sw = Math.max(vw, vh * 16 / 9), sh = sw * 9 / 16;
    var sl = (vw - sw) / 2, st = (vh - sh) / 2;
    stage.classList.add("is-sized");
    stage.style.width = sw + "px";
    stage.style.height = sh + "px";
    stage.style.left = sl + "px";
    stage.style.top = st + "px";

    headline.style.left = (-sl) + "px";
    headline.style.width = vw + "px";

    var portrait = vh > 1.2 * vw;
    var bStage = sh * (portrait ? 0.362 : 0.43);   // baseline, stage coords
    var bView = st + bStage;                         // baseline, viewport coords
    var navBottom = nav.offsetTop + nav.offsetHeight;

    var a = (0.625 * sw) / wpe;
    var b = (0.92 * vw) / wpe;
    var c = (bView - (navBottom + 0.035 * vh)) / 0.88;
    var F = Math.max(24, Math.min(a, b, c));

    word.style.fontSize = F + "px";
    word.style.top = (bStage - blr * F) + "px";
    kicker.style.fontSize = (0.118 * F) + "px";
    kicker.style.top = (bStage - (0.727 + 0.02) * F) + "px";
  }

  var rz = 0;
  window.addEventListener("resize", function () {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(layout);
  });
  layout();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 100px "Inter"', "Summit").then(function () {
      measure(); layout();
    }, function () {});
    document.fonts.ready.then(function () { measure(); layout(); });
  } else {
    measure(); layout();
  }

  /* ---------- load images (sized to the screen) ---------- */
  var sw0 = Math.max(hero.clientWidth, hero.clientHeight * 16 / 9);
  var wStage = pickW(sw0), wHero = pickW(hero.clientWidth);

  function loadImg(el, src) {
    return new Promise(function (res) {
      var done = function () { res(); };
      el.onload = function () {
        if (el.decode) el.decode().then(done, done); else done();
      };
      el.onerror = done;
      el.src = src;
      if (el.complete && el.naturalWidth) el.onload();
    });
  }
  function loadBg(el, src) {
    return new Promise(function (res) {
      var i = new Image();
      var done = function () { el.style.backgroundImage = 'url("' + src + '")'; res(); };
      i.onload = function () { if (i.decode) i.decode().then(done, done); else done(); };
      i.onerror = function () { res(); };
      i.src = src;
    });
  }

  var imgReady = [
    loadImg($("imgBack"), img(IDS.back, wStage)),
    loadImg($("imgMid"), img(IDS.mid, wStage)),
    loadImg($("imgFront"), img(IDS.front, wStage))
  ];

  /* ---------- reduced motion: final frame, nothing plays ---------- */
  if (reduce) {
    hero.classList.remove("intro");
    opening.hidden = true;
    doors.hidden = true;
    return;
  }

  imgReady.push(loadImg($("imgAerial"), img(IDS.aerial, wStage)));
  imgReady.push(loadBg(doorL, img(IDS.doors, wHero)).then(function () {
    doorR.style.backgroundImage = doorL.style.backgroundImage;
  }));

  var tiltReady = new Promise(function (res) {
    var done = function () { res(); };
    tilt.addEventListener("canplaythrough", done, { once: true });
    tilt.addEventListener("error", done, { once: true });
    tilt.src = TILT_SRC;
    tilt.load();
  });

  /* ---------- timeline ---------- */
  var D = 7400;
  var anims = [];
  var E = {
    door1: "cubic-bezier(.1,.2,.8,1)",
    door2: "cubic-bezier(.4,.6,.9,1)",
    io: "ease-in-out",
    open: "cubic-bezier(.45,0,.55,1)",
    rise: "cubic-bezier(.2,.65,.3,1)",
    back: "cubic-bezier(.45,0,.35,1)",
    mid1: "cubic-bezier(.45,0,.3,1)",
    mid2: "cubic-bezier(.45,0,.55,1)",
    head: "cubic-bezier(.3,0,.4,1)",
    man1: "cubic-bezier(.2,.5,.2,1)",
    man2: "cubic-bezier(.45,0,.55,1)"
  };

  // points: [timeSeconds, props, easingToNext]
  function track(el, points) {
    var kf = [];
    var first = points[0], last = points[points.length - 1];
    if (first[0] > 0) kf.push(Object.assign({ offset: 0, easing: "linear" }, first[1]));
    points.forEach(function (p) {
      var o = Math.min(1, (p[0] * 1000) / D);
      var k = Object.assign({ offset: o }, p[1]);
      k.easing = p[2] || "linear";
      kf.push(k);
    });
    if (last[0] * 1000 < D) kf.push(Object.assign({ offset: 1 }, last[1]));
    var a = el.animate(kf, { duration: D, fill: "both" });
    a.pause();
    a.currentTime = 0;
    anims.push(a);
    return a;
  }

  track(doorL, [[0.02, { transform: "translateX(0)" }, E.door1], [1.13, { transform: "translateX(-101%)" }]]);
  track(doorR, [[0.02, { transform: "translateX(0)" }, E.door2], [1.24, { transform: "translateX(101%)" }]]);
  track(tilt, [[1.19, { opacity: 0 }, E.io], [1.47, { opacity: 1 }]]);
  track(opening, [[2.45, { opacity: 1 }, E.open], [2.95, { opacity: 0 }]]);
  track(nav, [[2.45, { opacity: 0, transform: "translateY(-6px)" }, "ease-out"], [2.75, { opacity: 1, transform: "translateY(0)" }]]);
  track(kicker, [[2.45, { opacity: 0, transform: "translate(0, .5em)" }, E.rise], [3.10, { opacity: 1, transform: "translate(0, 0)" }]]);
  letters.forEach(function (l, i) {
    var s = 2.45 + i * 0.054;
    track(l, [[s, { opacity: 0, transform: "translateY(.14em)" }, E.rise], [s + 0.70, { opacity: 1, transform: "translateY(0)" }]]);
  });
  track(shade, [[2.90, { opacity: 0 }, E.io], [3.70, { opacity: 1 }]]);
  track(back, [[2.90, { transform: "translateY(0)" }, E.back], [4.30, { transform: "translateY(-1.5%)" }]]);
  track(mid, [
    [2.90, { transform: "translateY(0)" }, E.mid1],
    [4.30, { transform: "translateY(-4%)" }],
    [4.60, { transform: "translateY(-4%)" }, E.mid2],
    [6.90, { transform: "translateY(0)" }]
  ]);
  track(headline, [[3.00, { transform: "translateY(6%)" }, E.head], [4.80, { transform: "translateY(0)" }]]);
  track(front, [
    [3.35, { transform: "translateY(66%)" }, E.man1],
    [6.00, { transform: "translateY(-2.5%)" }, E.man2],
    [7.30, { transform: "translateY(0)" }]
  ]);

  /* ---------- rain loop ---------- */
  var RAIN = [rainA, rainB], LOOP = 3.6, LEAD = 0.75, activeRain = -1, rainStarted = false;
  function rainOn(i) {
    var v = RAIN[i];
    try { v.currentTime = 0; } catch (e) {}
    var p = v.play(); if (p && p.catch) p.catch(function () {});
    v.classList.add("on");
  }
  RAIN.forEach(function (v, i) {
    v.addEventListener("timeupdate", function () {
      if (i !== activeRain) return;
      if (v.currentTime >= LOOP - LEAD) {
        var n = 1 - i;
        activeRain = n;
        rainOn(n);
        v.classList.remove("on");
        setTimeout(function () { if (activeRain !== i) v.pause(); }, 800);
      }
    });
  });
  function loadRain() {
    if (rainA.src) return;
    rainA.src = RAIN_SRC; rainB.src = RAIN_SRC;
    rainA.load(); rainB.load();
  }
  function startRain() {
    if (rainStarted) return;
    rainStarted = true;
    loadRain();
    activeRain = 0;
    rainOn(0);
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && rainStarted && activeRain >= 0) {
      var v = RAIN[activeRain];
      if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    }
  });

  /* ---------- tilt video sync ---------- */
  var T0 = 1.25, T1 = 2.85, WIN = T1 - T0, tiltDone = false, tiltStarted = false;
  function syncTilt(t) {
    if (tiltDone) return;
    var dur = (isFinite(tilt.duration) && tilt.duration > 0) ? tilt.duration : 5.04;
    var base = dur / WIN;
    if (t >= T1) {
      tiltDone = true;
      tilt.pause();
      try { tilt.currentTime = Math.max(0, dur - 0.03); } catch (e) {}
      return;
    }
    if (t < T0) return;
    if (!tiltStarted) {
      tiltStarted = true;
      tilt.playbackRate = base;
      var p = tilt.play(); if (p && p.catch) p.catch(function () {});
    }
    var target = ((t - T0) / WIN) * dur;
    var diff = target - tilt.currentTime;
    var r = base * (1 + diff * 1.5);
    r = Math.max(0.85 * base, Math.min(1.2 * base, r));
    if (Math.abs(r - tilt.playbackRate) > 0.01 * base) tilt.playbackRate = r;
  }

  /* ---------- master clock ---------- */
  var started = false, t0 = 0;
  function finish() {
    anims.forEach(function (a) { a.currentTime = D; });
    hero.classList.remove("intro");
    anims.forEach(function (a) { a.cancel(); });
    opening.hidden = true;
    doors.hidden = true;
    tilt.pause();
  }
  function frame(now) {
    var ms = Math.min(now - t0, D);
    for (var i = 0; i < anims.length; i++) anims[i].currentTime = ms;
    var t = ms / 1000;
    syncTilt(t);
    if (t >= 2.40) startRain();
    if (ms >= D) { finish(); return; }
    requestAnimationFrame(frame);
  }
  function start() {
    if (started) return;
    started = true;
    requestAnimationFrame(function (now) { t0 = now; frame(now); });
  }

  var failsafe = setTimeout(start, 5000);
  Promise.all(imgReady.concat([tiltReady])).then(function () {
    loadRain();
    setTimeout(function () { clearTimeout(failsafe); start(); }, 120);
  });
})();
</script>
